appId: com.brainboard.app
productName: Brain Board
copyright: Copyright © 2026 Brain Board
electronVersion: 31.2.0

directories:
  output: dist_setup

files:
  - "app_bundle/**/*"
  - "!app_bundle/boards/*"
  - "app_bundle/boards/ejemplo.json"
  - "boards/ejemplo.json"
  - "package.json"

asarUnpack:
  - "node_modules/offline-js/**/*"

publish:
  provider: github
  owner: PabloLivian
  repo: BrainBoard

win:
  icon: assets/installer_icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  installerIcon: assets/installer_icon.ico
  uninstallerIcon: assets/installer_icon.ico
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Brain Board"
  runAfterFinish: true
