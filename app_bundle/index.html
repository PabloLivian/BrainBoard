<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; connect-src 'self' file: data: blob:;"
  />
  <title>Brain Board</title>
  <link rel="stylesheet" href="static/css/fonts.css" />
  <link rel="stylesheet" href="whiteboard/whiteboard.css" />
</head>
<body>
  <div id="app-container">
    <!-- Lienzo principal interactivo -->
    <canvas id="viewport-canvas"></canvas>

    <!-- Barra superior -->
    <div id="top-bar">
      <div class="top-bar-left">
        <div class="logo-badge">
          <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M4 4h4v16H4V4zm6 4h4v12h-4V8zm6-4h4v16h-4V4z"/>
          </svg>
          <span>Brain Board</span>
        </div>
        <input type="text" id="board-title" value="DEV / AI" title="Haz clic para renombrar el tablero" />
        <div class="save-status">
          <div class="status-dot"></div>
          <span id="save-status-text">Guardado en local</span>
        </div>
      </div>

      <div class="top-bar-center">
        <button id="btn-undo" class="btn btn-icon" title="Deshacer (Ctrl+Z)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button id="btn-redo" class="btn btn-icon" title="Rehacer (Ctrl+Y)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
      </div>

      <div class="top-bar-right">
        <button id="btn-new" class="btn" title="Nuevo tablero en blanco">Nuevo</button>
        <button id="btn-open" class="btn" title="Abrir tablero desde archivo JSON">Abrir</button>
        <button id="btn-save" class="btn btn-primary" title="Descargar copia del tablero en JSON">Guardar</button>
        <button id="btn-load-dev-ai" class="btn" style="background:#e0e7ff;color:#3730a3;font-weight:600;" title="Cargar tablero DEV / AI">Tablero DEV / AI</button>
        <button id="btn-toggle-assets" class="btn" title="Abrir galeria de imagenes del archivo .rtb">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Imagenes .RTB (147)</span>
        </button>
      </div>
    </div>

    <!-- Barra de herramientas lateral izquierda -->
    <div id="left-toolbar">
      <button class="tool-btn active" data-tool="select" title="Puntero de seleccion (V)">
        <svg viewBox="0 0 24 24"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
      </button>
      <button class="tool-btn" data-tool="hand" title="Mano para desplazarse (H o Barra espaciadora)">
        <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v3M14 6a2 2 0 0 0-4 0v5M10 8a2 2 0 0 0-4 0v7a6 6 0 0 0 12 0v-4a2 2 0 0 0-4 0"/></svg>
      </button>
      <button class="tool-btn" data-tool="sticky_note" title="Nota Adhesiva (N)">
        <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg>
      </button>
      <button class="tool-btn" data-tool="shape" data-shape="rectangle" title="Forma: Rectangulo (S)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="shape" data-shape="circle" title="Forma: Circulo">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="tool-btn" data-tool="shape" data-shape="diamond" title="Forma: Rombo">
        <svg viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Texto libre (T)">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>
      <button class="tool-btn" data-tool="connector" title="Flecha conector (L)">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
      </button>
      <button class="tool-btn" data-tool="pen" title="Lapiz de dibujo a mano alzada (P)">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="frame" title="Marco contenedor (F)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/></svg>
      </button>
    </div>

    <!-- Barra flotante de propiedades -->
    <div id="properties-bar">
      <div id="color-picker-group" class="color-picker-group"></div>
      <div class="divider"></div>
      <button id="btn-prop-duplicate" class="btn btn-icon" title="Duplicar seleccionado (Ctrl+D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button id="btn-prop-delete" class="btn btn-icon" title="Eliminar seleccionado (Supr / Backspace)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <!-- Controles de zoom abajo a la derecha -->
    <div id="zoom-controls">
      <button id="btn-zoom-out" class="btn btn-icon" title="Alejar (-)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" class="btn btn-icon" title="Acercar (+)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <div class="divider"></div>
      <button id="btn-zoom-fit" class="btn btn-icon" title="Centrar todo el contenido">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>

    <!-- Panel lateral de recursos extraidos del RTB -->
    <div id="assets-drawer">
      <div class="drawer-header">
        <span>Imagenes del tablero (.RTB)</span>
        <button id="btn-close-drawer" class="btn btn-icon" style="height:24px;width:24px;">✕</button>
      </div>
      <div id="assets-container" class="drawer-content"></div>
    </div>

    <!-- Editor in-situ para textos y notas -->
    <textarea id="inline-text-editor"></textarea>

    <!-- Input oculto para abrir JSON -->
    <input type="file" id="file-input" accept=".json" style="display: none;" />
  </div>

  <script src="whiteboard/canvas_engine.js"></script>
  <script src="whiteboard/board_app.js"></script>
</body>
</html>
